[project]
name = "planeacion"
version = "0.1.0"
description = "Planeación logística — Distribuciones Santiago de Tunja"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "supabase>=2.15",
    "openpyxl>=3.1",
    "pydantic-settings>=2.9",
    "streamlit>=1.40",
    "xlrd>=2.0",
]

[project.scripts]
planeacion-sembrar = "planeacion.infraestructura.adaptadores.entrada.cli.sembrar:main"
planeacion-pivote = "planeacion.infraestructura.adaptadores.entrada.cli.pivote:main"
planeacion-resolver-nuevos = "planeacion.infraestructura.adaptadores.entrada.cli.resolver_nuevos:main"
planeacion-balancear = "planeacion.infraestructura.adaptadores.entrada.cli.balancear:main"
planeacion-sembrar-repertorio = "planeacion.infraestructura.adaptadores.entrada.cli.sembrar_repertorio:main"
planeacion-auditar-zonas = "planeacion.infraestructura.adaptadores.entrada.cli.auditar_zonas:main"
planeacion-fusionar-zonas = "planeacion.infraestructura.adaptadores.entrada.cli.fusionar_zonas:main"
planeacion-validar = "planeacion.infraestructura.adaptadores.entrada.cli.validar:main"
planeacion-resincronizar = "planeacion.infraestructura.adaptadores.entrada.cli.resincronizar:main"
planeacion-municipios-zona = "planeacion.infraestructura.adaptadores.entrada.cli.municipios_de_zona:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.11",
    "mypy>=1.15",
    "types-openpyxl>=3.1",
    "xlwt>=1.3",
    "types-xlrd>=2.0.0.20260518",
]

[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
# Sin python_version fijo: analiza con la versión del venv. Los stubs de numpy
# (transitiva de streamlit) usan sintaxis 3.12+; la compatibilidad 3.11 del
# código propio la vigila ruff (target-version py311).
strict = true
mypy_path = "src"
packages = ["planeacion"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["supabase", "supabase.*", "postgrest", "postgrest.*"]
ignore_missing_imports = true

# Dependencias transitivas de streamlit que no usamos directamente; sus stubs
# usan sintaxis de Python 3.12 y romperían el análisis con python_version 3.11.
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*", "pandas", "pandas.*", "pyarrow", "pyarrow.*"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: pruebas que requieren credenciales reales de Supabase (se saltan si no hay .env)",
]
